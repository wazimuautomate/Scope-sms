# Memory for the Gradle daemon. GitHub's ubuntu-latest runners have 16 GB, so
# 4 GB is comfortable; the Kotlin/Compose compiler is the hungry part.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Build speed. Configuration cache is deliberately left off for now — it's
# well supported on Gradle 9/AGP 9, but Phase 0 is optimising for a build that
# works over a build that's fast, and later phases add the plugins (KSP, Room)
# most likely to trip over it. Revisit once the dependency graph settles.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX only.
android.useAndroidX=true

# Each module gets its own R class rather than inheriting its dependencies'
# resources. Smaller R, faster builds. Default since AGP 8, set explicitly.
android.nonTransitiveRClass=true

kotlin.code.style=official
