name: Build

# CI verification, not distribution. There is no local Android Studio
# (CLAUDE.md constraint 8), so "it builds" means "this workflow went green".
# The app the agent installs is the SIGNED RELEASE cut by release.yml from a
# version tag — this workflow never publishes an APK. Debug builds are for
# developers only and are never handed to the agent (no "debug apks as
# releases").
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant. Cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # read-only: this workflow no longer publishes anything.
  contents: read

jobs:
  build:
    name: Unit tests + lint + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # gradle-wrapper.jar is committed (CI runs ./gradlew). Checked against
      # Gradle's published checksums so a swapped wrapper can't execute
      # arbitrary code in the build.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # JDK 21 for Robolectric against SDK 36+. compileOptions/jvmTarget stay at
      # 17 in app/build.gradle.kts — a 21 toolchain emits 17 bytecode fine.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Lint runs on every push so issues surface on the PR, not at release time.
      # Non-gating (build.gradle.kts sets lint.abortOnError = false) so a
      # pre-existing warning can't block a branch; the HTML report is uploaded.
      - name: Run Android lint
        run: ./gradlew lint --stacktrace

      # continue-on-error on every upload-artifact step below: these are
      # convenience downloads for a human, not gates. Without it, a transient
      # artifact-storage failure (e.g. the account's Actions storage quota
      # being full — happened 2026-07-18, see memory.md) skipped every step
      # after it, including the debug APK build and the Room schema upload —
      # neither of which should depend on whether a test report happened to
      # upload.
      - name: Upload test + lint reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

      # Debug build — compile verification, and a developer-only artifact. It is
      # NOT signed with the release key and NOT published anywhere: it installs
      # as "Scope SMS Debug" (applicationId com.tricreta.scopesms.debug) beside
      # the real app and is never used to update a release install.
      # UPDATE_READ_TOKEN is baked into BuildConfig so a sideloaded debug build's
      # in-app updater can reach the private release repo too. Absent (secret not
      # set) → empty → the updater reports "not configured", never errors.
      - name: Build debug APK
        env:
          UPDATE_READ_TOKEN: ${{ secrets.UPDATE_READ_TOKEN }}
        run: ./gradlew assembleDebug --stacktrace

      # Room's schema JSON is generated by KSP during the build and must end up
      # committed — it is the baseline every future migration diffs against. With
      # no local Android Studio, this artifact is the only way to get the
      # generated file back into the repo when the schema changes.
      - name: Upload Room schemas
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas-${{ github.run_number }}
          path: app/schemas/
          retention-days: 14
          if-no-files-found: error

      # Kept for developers to trace an APK back to its commit. Delivered as a
      # .zip needing a GitHub login — deliberately not the agent's download.
      - name: Upload debug APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: scope-sms-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  # Cross-version smoke tests. ON because the Android Keystore (which holds the
  # agent's gateway API key) has no JVM equivalent and a documented history of
  # breaking on specific OEM builds. Matrix is the floor (30 = minSdk) and the
  # ceiling (36 = targetSdk). continue-on-error: emulator jobs on hosted runners
  # flake for reasons unrelated to the app — read the result, don't gate on it.
  instrumented:
    name: Smoke test on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-report-api${{ matrix.api-level }}-${{ github.run_number }}
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore
