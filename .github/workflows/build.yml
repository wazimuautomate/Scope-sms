name: Build

# CI is not a convenience on this project — it is the only compiler.
# There is no local Android Studio (CLAUDE.md constraint 8), so "it builds"
# means "this workflow went green", and the agent installs the APK this
# workflow uploads.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant. Cancel it
# rather than queueing behind it — several phases are being built in parallel
# and they share this runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write, not read: the build job publishes the signed testing APK to a rolling
  # "testing" pre-release so the agent has a direct, un-zipped download link
  # (workflow artifacts are always delivered as a .zip and need a GitHub login).
  contents: write

jobs:
  build:
    name: Unit tests + signed testing APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # gradle-wrapper.jar is a binary committed to this repo (CI runs
      # ./gradlew and has no other way to bootstrap Gradle). This checks it
      # against Gradle's published checksums on every run, so a tampered or
      # swapped wrapper can't quietly execute arbitrary code in the build that
      # produces the agent's APK.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # JDK 21, bumped from 17 by Phase 8 — the snag Phase 0 predicted here has
      # now arrived. Phase 8's DAO tests run Room against real in-memory SQLite
      # via Robolectric, and Robolectric needs JDK 21 to run against SDK 36+
      # (those SDK jars are Java-21 compiled); on 17 it fails with
      # UnsupportedClassVersionError before a single assertion runs.
      #
      # This is the runner's JDK only. compileOptions/jvmTarget stay at 17 in
      # app/build.gradle.kts, which is correct and not an oversight: 17 is AGP's
      # minimum, not its maximum, so a 21 toolchain happily emits 17 bytecode and
      # the app's own compatibility is unchanged. See memory.md.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Handles Gradle's own caching; no separate actions/cache step needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Is the permanent signing key available? Secrets aren't allowed in `if:`
      # expressions directly, so surface a plain boolean output the later steps
      # can gate on. Everything that produces the agent's installable APK is
      # gated on this being true — an unsigned or debug-key APK must never reach
      # the "testing" pre-release, because it wouldn't update over the last one.
      - name: Detect signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key set — building an unsigned debug APK and skipping the testing release. Add the four SIGNING_* secrets (see README, 'Cutting a release') to get a signed, updatable APK."
          fi

      # Decode the base64 keystore secret to the runner's temp dir (never the
      # workspace, which artifact steps sweep up) and hand its path to Gradle via
      # SIGNING_KEYSTORE_PATH — the same env var app/build.gradle.kts reads for
      # the debug build's signingConfig.
      - name: Materialise the signing keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Uploaded even when tests pass, but the reason it exists is failure:
      # with no local build, this HTML report is the only way to see which
      # assertion broke without re-running anything.
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      # Signed with the permanent release key when the secrets are present (see
      # the debug signingConfig in app/build.gradle.kts), so the resulting APK
      # updates over both the previous testing build and the eventual v1.0.0
      # release with no uninstall. R8 is off on debug, so this is a faithful
      # build of the UI to test without minification risk in the way.
      - name: Build debug APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      # Room's schema JSON is generated by KSP during the build, and it has to
      # end up committed: it is the baseline every future migration diffs
      # against, and data/README.md rules out destructive migration on an app
      # holding the agent's live pricing and history. With no local Android
      # Studio (constraint 8), this artifact is the only way to get the
      # generated file back into the repo. Whoever changes the schema: download
      # this and commit app/schemas.
      - name: Upload Room schemas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas-${{ github.run_number }}
          path: app/schemas/
          retention-days: 14
          if-no-files-found: error

      # Kept for feature branches and for tracing an APK back to its commit —
      # but note GitHub delivers this as a .zip and it needs a login to fetch.
      # The agent's real download is the "testing" pre-release published below.
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: scope-sms-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      # versionName drives the human-facing APK name. Read from source so there
      # is one place to bump it (app/build.gradle.kts), never a value duplicated
      # into the workflow.
      - name: Read version name
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # A friendly filename — "Scope-SMS-version-0.9.0.apk" — rather than the
      # Gradle default "app-debug.apk". Only on main, and only when signed, so
      # the file the agent grabs is always the updatable one.
      - name: Name the APK for humans
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" "Scope-SMS-version-${{ steps.version.outputs.name }}.apk"

      # The agent's actual download: a directly-openable APK on a rolling
      # "testing" pre-release, no login and no .zip. Each main build replaces the
      # asset, so the link is always the latest build. Skipped until the signing
      # secrets exist — an un-updatable APK here would defeat the whole point.
      - name: Publish the testing pre-release
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: testing
          name: Scope SMS version ${{ steps.version.outputs.name }} (testing)
          draft: false
          prerelease: true
          files: Scope-SMS-version-*.apk
          body: |
            Latest **testing** build of Scope SMS — version ${{ steps.version.outputs.name }}
            (commit ${{ github.sha }}).

            ## Installing
            1. Tap the `.apk` below on the phone that runs Scope SMS.
            2. Allow installing from this source when Android asks.
            3. Open Scope SMS.

            Updating a later build? Just install it over the top — your prices,
            messages and activity history are kept, because every build is signed
            with the same key.

            One-time note: the first time you install this signed build over the
            earlier unsigned test build, Android asks you to uninstall the old one
            once. After that, all updates are seamless.

  # Phase 10 — cross-version testing.
  #
  # BUILD-PLAN Phase 10 makes this optional and asks for the decision to be
  # flagged in memory.md either way. It is ON, for one reason: the Android
  # Keystore holds the agent's gateway API key, has no JVM equivalent, and has a
  # documented history of breaking on specific OEM builds. Every other test in
  # this project runs on the JVM and cannot see it. A `SmokeTest` that only ever
  # ran on the developer's chosen API level would be exactly the kind of "it
  # worked for me" this project has no room for.
  #
  # The matrix is the floor and the ceiling, not a sweep:
  #   30 — minSdk, and CLAUDE.md constraint 1 says verify on the floor. It is
  #        also the version the target market's low-end Tecno/Infinix handsets
  #        actually run.
  #   36 — targetSdk, where the background-execution and broadcast rules are
  #        strictest.
  # The versions between them share both codepaths; running them would cost
  # minutes a push to re-prove the same two things.
  #
  # `continue-on-error`: this job must not gate the debug APK. Emulator jobs on
  # hosted runners flake (KVM, boot timeouts, snapshot corruption) for reasons
  # that have nothing to do with the app, and a red tick nobody trusts is worse
  # than no tick. Read the result, don't merge on it blindly.
  instrumented:
    name: Smoke test on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Hosted runners expose KVM but not to the runner user by default; without
      # this the emulator falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # google_apis, not playstore: a Play Store image is locked down (no
          # root, no writable system) and buys this app nothing — it uses no
          # Google Play services.
          target: google_apis
          arch: x86_64
          # No window, no audio, no boot animation. Saves minutes per run.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-report-api${{ matrix.api-level }}-${{ github.run_number }}
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore
