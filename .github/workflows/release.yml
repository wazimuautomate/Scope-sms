name: Release

# Tag-triggered. Push `v1.0.0` (matching versionName in app/build.gradle.kts)
# and this produces THE app the agent installs: a release APK signed with the
# permanent key, attached to a GitHub Release, plus an update.json manifest the
# in-app updater reads. Everything happens here — the signing key exists only as
# a GitHub Secret, and the APK is built from a tagged commit by a script anyone
# can read, not from a laptop.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0). Must already exist.'
        required: true

permissions:
  contents: write # create the Release, upload the APK, and commit update.json.

env:
  # Installs below this versionCode are treated as forced by the in-app updater.
  # Bump only when an older build must not be allowed to linger.
  MIN_SUPPORTED_VERSION_CODE: 1

jobs:
  release:
    name: Signed release APK + update.json
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Full history + credentials: we read the tag annotation for release
          # notes and push update.json back to main.
          fetch-depth: 0
          persist-credentials: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # versionName/versionCode come from source — one place to bump them.
      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Read versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      # The tag is what the agent sees; versionName is what the installed app
      # reports and the update check compares. If they disagree, the prompt
      # reappears forever on a phone that already has the newest build — so
      # disagreeing fails the release rather than shipping it.
      - name: Check the tag matches versionName
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "$TAG" != "v${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag $TAG does not match versionName ${{ steps.version.outputs.name }} in app/build.gradle.kts."
            echo "::error::Bump versionName (and versionCode) or retag."
            exit 1
          fi

      # versionCode must strictly increase over what is currently published in
      # main:update.json, or the update either fails to install or makes the
      # prompt reappear forever. First release (no update.json yet) → previous 0.
      - name: Guard versionCode is strictly increasing
        run: |
          git fetch --no-tags origin main || true
          OLD_JSON=$(git show FETCH_HEAD:update.json 2>/dev/null || echo '{}')
          OLD_VC=$(echo "$OLD_JSON" | jq -r '.versionCode // 0')
          NEW_VC="${{ steps.version.outputs.code }}"
          echo "published versionCode=$OLD_VC, this build=$NEW_VC"
          if [ "$NEW_VC" -le "$OLD_VC" ]; then
            echo "::error::versionCode $NEW_VC must be strictly greater than the published $OLD_VC. Bump versionCode in app/build.gradle.kts."
            exit 1
          fi

      # Tests gate the release — the one build that reaches the agent's live
      # business is the last place to skip the safety net.
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run Android lint
        run: ./gradlew lint --stacktrace

      - name: Upload test + lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

      # The permanent keystore lives only as a base64 secret. Decoded to the
      # runner's temp dir (never the workspace, which artifact/commit steps sweep
      # up), and the runner is destroyed afterward.
      - name: Materialise the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the four ANDROID_* signing secrets — see README, 'Cutting a release'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scope-sms-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/scope-sms-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Belt and braces: signingConfigs only registers a config when the keystore
      # path is set, so a missing secret yields a silently UNSIGNED APK that fails
      # to install with a message that explains nothing. Fail here, where it's
      # obvious.
      - name: Verify the APK is signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verifying $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Name the APK and compute SHA-256
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          OUT="scope-sms-release-${TAG}.apk"
          cp "$APK" "$OUT"
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "APK=$OUT SHA256=$SHA"

      # Generate update.json. The release-asset URL is deterministic from the tag
      # and filename, so it's known before upload — no chicken-and-egg.
      - name: Generate update.json
        id: manifest
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ steps.apk.outputs.file }}"
          NOTES=$(git tag -l --format='%(contents:subject)' "$TAG")
          [ -z "$NOTES" ] && NOTES="Update to ${{ steps.version.outputs.name }}."
          jq -n \
            --argjson vc "${{ steps.version.outputs.code }}" \
            --arg vn "${{ steps.version.outputs.name }}" \
            --arg url "$ASSET_URL" \
            --arg sha "${{ steps.apk.outputs.sha }}" \
            --arg notes "$NOTES" \
            --argjson req false \
            --argjson minvc "${MIN_SUPPORTED_VERSION_CODE}" \
            '{versionCode:$vc, versionName:$vn, apkUrl:$url, sha256:$sha, releaseNotes:$notes, required:$req, minimumSupportedVersionCode:$minvc}' \
            > update.json
          echo "--- update.json ---"
          cat update.json

      # Publish the Release + attach the signed APK AND update.json (the latter
      # as a stable-per-tag fallback source for the manifest). Done BEFORE the
      # commit to main so the asset the manifest points at already exists.
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Scope SMS ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            update.json
          body: |
            ## Installing / updating

            1. Tap **`${{ steps.apk.outputs.file }}`** below on the phone that runs Scope SMS.
            2. Android will ask to allow installing from this source — allow it.
            3. Install. If you already have Scope SMS, this updates it in place —
               your bundle prices, messages and activity history are kept.

            You can also update from inside the app: **Settings → Check for updates**.

      # Publish update.json to the stable raw URL the app reads
      # (raw.githubusercontent.com/<repo>/main/update.json). Committed after the
      # asset is live so the manifest never points at a missing file. [skip ci]
      # keeps this housekeeping commit from re-triggering the Build workflow.
      - name: Commit update.json to main
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp update.json "$RUNNER_TEMP/update.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git checkout -B main FETCH_HEAD
          cp "$RUNNER_TEMP/update.json" update.json
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json unchanged — nothing to commit."
          else
            git commit -m "release: publish update.json for ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
