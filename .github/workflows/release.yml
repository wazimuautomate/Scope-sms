name: Release

# Phase 11. Tag-triggered: push `v1.0.0` and this produces the signed APK the
# agent installs, attached to a GitHub Release.
#
# Everything happens here, not on a developer's machine — there is no local
# Android Studio (CLAUDE.md constraint 8), and the signing key exists only as a
# GitHub Secret. That is the point: the APK the agent installs is built from a
# tagged commit by a script anyone can read, not from someone's laptop.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0). Must already exist.'
        required: true

permissions:
  contents: write # Needed to create the Release and upload the APK to it.

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The tag is what the agent sees on the Release page; versionName is what
      # the installed app reports and what the in-app update check compares
      # against. If they disagree, the update prompt reappears forever on a
      # phone that already has the newest build — so disagreeing fails the
      # release rather than shipping it.
      - name: Check the tag matches versionName
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$TAG versionName=$VERSION_NAME"
          if [ "$TAG" != "v$VERSION_NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION_NAME in app/build.gradle.kts."
            echo "::error::Bump versionName (and versionCode) or retag. See BUILD-PLAN Phase 11."
            exit 1
          fi

      # Tests gate the release. BUILD-PLAN Phase 11: "build, run tests, sign".
      # A release is the one build that reaches the agent's live business, so it
      # is the last place to skip the safety net.
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-test-report-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      # The keystore lives only as a base64 secret. Written to the runner's
      # temp dir (never the workspace, which artifact steps can sweep up), and
      # the runner is destroyed afterwards.
      - name: Materialise the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set."
            echo "::error::Add the four signing secrets — see README, 'Cutting a release'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Belt and braces. `signingConfigs` only registers a config when
      # SIGNING_KEYSTORE_PATH is set, so a missing secret yields a *silently
      # unsigned* APK that fails to install on the agent's phone with a message
      # that explains nothing. Fail here instead, where the reason is obvious.
      - name: Verify the APK is actually signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verifying $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Name the APK for humans
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Drop the leading "v" so the file reads "Scope-SMS-version-1.0.0.apk",
          # matching the versionName the app reports and the testing builds' name.
          VERSION="${TAG#v}"
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "Scope-SMS-version-$VERSION.apk"

      # The deliverable. Attached to a Release rather than left as a workflow
      # artifact because artifacts expire and need a GitHub login to download —
      # the agent has neither. A Release asset is a permanent public URL they can
      # open on the phone.
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Scope SMS version ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: Scope-SMS-version-*.apk
          body: |
            ## Installing

            1. Tap the `.apk` below on the phone that will run Scope SMS.
            2. Android will ask to allow installing from this source — allow it.
               (It only trusts this one app; you can turn it back off after.)
            3. Open Scope SMS and follow the setup steps.

            Updating? Just install this over the top. Your bundle prices,
            messages and activity history are kept.
