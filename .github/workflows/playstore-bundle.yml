name: Play Store Bundle

# On-demand only (workflow_dispatch) — builds a signed Android App Bundle
# (.aab) for uploading to Google Play Console. Deliberately separate from
# release.yml's tag-triggered GitHub direct-install APK flow (CLAUDE.md
# constraint 8's existing channel): this workflow never touches update.json,
# never publishes a GitHub Release, never bumps versionCode, and isn't
# triggered by a tag push. It just builds whatever versionCode/versionName is
# on the chosen ref, signed with the same permanent keystore release.yml
# already uses (reused as the Play Console "upload key", not regenerated —
# same custody as every other signed build this project produces).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  bundle:
    name: Signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      # Same permanent keystore release.yml materialises (ANDROID_* secrets,
      # falling back to the legacy SIGNING_* names). Decoded to the runner's
      # temp dir only, never the workspace; the runner is destroyed after.
      - name: Materialise the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No keystore secret set. Add ANDROID_KEYSTORE_BASE64 (or legacy SIGNING_KEYSTORE_BASE64) — see README, 'Cutting a release'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scope-sms-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/scope-sms-release.jks" >> "$GITHUB_ENV"

      # bundleRelease shares buildTypes.release.signingConfig with
      # assembleRelease (app/build.gradle.kts) — no separate AAB signing setup
      # needed. Play Console still expects you to choose, at first upload, how
      # this "upload key" relates to the actual app-signing key it will use for
      # end users (let Google generate one, or provide this same key as the
      # real app-signing key via Play's PEPK export) — that choice happens in
      # Play Console, not here.
      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
          UPDATE_READ_TOKEN: ${{ secrets.UPDATE_READ_TOKEN }}
        run: ./gradlew bundleRelease --stacktrace

      # Belt and braces, same reasoning as release.yml's APK verify step: a
      # missing secret makes signingConfigs silently register nothing, so an
      # unsigned bundle would otherwise only surface as a cryptic Play Console
      # rejection much later. jarsigner's own exit code fails this step.
      - name: Verify the AAB is signed
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "Verifying $AAB"
          jarsigner -verify -verbose -certs "$AAB"

      - name: Name the AAB
        id: aab
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          OUT="scope-sms-${{ steps.version.outputs.name }}-vc${{ steps.version.outputs.code }}.aab"
          cp "$AAB" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "Built $OUT"

      # Login-gated download (GitHub Actions artifacts always are) — fine here,
      # this is for the developer to pull down and upload to Play Console, not
      # the agent's direct-install channel (that's release.yml's GitHub Release
      # asset, untouched by this workflow).
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.aab.outputs.file }}
          path: ${{ steps.aab.outputs.file }}
          retention-days: 14
